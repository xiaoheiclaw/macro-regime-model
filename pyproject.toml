[project]
name = "macro-regime-model"
version = "0.1.0"
description = "Macro regime attribution and allocation research"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2,<3.0",  # "ME" alias needs >=2.2; <3.0 avoids pandas 3.0.x resample SIGBUS w/ numpy 2.4
    "numpy>=1.26",
    "scipy>=1.12",
    "yfinance>=0.2",
    "fredapi>=0.5",
    "statsmodels>=0.14",
    "numba>=0.59",
    "scikit-learn>=1.4",
    "httpx>=0.28.1",
    "arch>=6.0",
    "xlrd>=2.0",       # Shiller ie_data.xls (legacy .xls) reader for leverage_monitor
    "openpyxl>=3.1",   # FINRA margin-statistics.xlsx reader for leverage_monitor
]

[project.optional-dependencies]
test = ["pytest"]
